name: Docker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker/**
      - .github/workflows/docker.yml
      - package.json
      - bun.lock
      - tsconfig*.json
      - src/**
      - scripts/**
      - build/**

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker build -t botmux:docker-test .
      - run: sh docker/smoke.sh botmux:docker-test
